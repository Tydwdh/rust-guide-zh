[book]
title = "Rust 指南（暂定）"
authors = ["tyd"]
language = "zh-CN"

[rust]
# 必须显式设置：默认 2015 会让 async 等新语法在 `mdbook test` 里直接编译失败（03 实测）
edition = "2024"

[build]
# SUMMARY 指向缺失文件时报错；默认 true 会静默建空文件（03 实测）
create-missing = false

# [output.html] 渲染 / 搜索 / 数学等配置按需再加。
# [output.linkcheck2] 属 06 定义的标准校验链（需先 `cargo install mdbook-linkcheck2`）；启用后 HTML 输出会挪到 book/html/。

# 书籍构建与校验。
# 仓库当前无远端，本工作流在公开到 GitHub 后自动生效。
# 链接检查等更多校验项待「06 写作与验收规范」定稿后加入。
#
# 注意：mdbook 0.5.4 在 book.toml 配置非法时只打印 ERROR 日志、仍 exit 0（2026-10-18 实测），
# 所以「退出码 = 0」不足以证明构建干净 —— 校验链怎么处理这个坑由「06 写作与验收规范」定。
name: book

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook 0.5.4
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Build
        run: mdbook build
      - name: Test code blocks
        run: mdbook test

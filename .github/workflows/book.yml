# 书籍构建与校验（标准链）。
# 仓库当前无远端，本工作流在公开到 GitHub 后自动生效。
# 链的说明与本地同套命令见 WRITING.md §3。
name: book

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook 与 linkcheck2
        run: |
          cargo install mdbook --version 0.5.4 --locked
          cargo install mdbook-linkcheck2 --locked

      - name: Build（扫日志 ERROR —— build 会静默吞错且 exit 0）
        run: |
          mdbook build 2>&1 | tee build.log
          if grep -q ERROR build.log; then
            echo "::error::build 日志含 ERROR"; exit 1
          fi

      - name: Test code blocks（失败 exit 101）
        run: mdbook test

      - name: Test examples workspace
        run: |
          if [ -f examples/Cargo.toml ]; then
            cargo test --manifest-path examples/Cargo.toml
          else
            echo "examples/ workspace 尚未就绪，跳过"
          fi

  # 下面四个作业是项目 5 加的发布前门禁（说明与发布清单见 src/project5-engineering.md）。
  # 每个作业一条 cargo 命令，本地同套命令能跑出同样结果。
  # 只覆盖 release-drill 这一个包 —— 其余示例 crate 的格式与 lint 状态不在本次范围。
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rustfmt（格式不一致即失败）
        run: cargo fmt --manifest-path examples/Cargo.toml -p release-drill --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clippy（警告即失败，含测试与示例目标）
        run: cargo clippy --manifest-path examples/Cargo.toml -p release-drill --all-targets -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rustdoc（警告即失败：断链、可疑 HTML 都算）
        run: cargo doc --manifest-path examples/Cargo.toml -p release-drill --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # 打包门禁：把 .crate 解开、在干净目录里重新编译一遍。
  # CI 里的工作树是干净的，所以不需要本地那种 --allow-dirty。
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo package（打包并验证 .crate 能编译）
        run: cargo package --manifest-path examples/Cargo.toml -p release-drill
